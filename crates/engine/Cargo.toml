[package]
name = "tau-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tau_engine"
path = "src/lib.rs"

[dependencies]
candle = { package = "candle-core", version = "0.11.0", features = ["cuda"] }
tau-chat = { path = "../chat" }
tau-models = { path = "../models" }
tau-metrics = { path = "../metrics" }
tau-cuda-kernels = { path = "../cuda-kernels" }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokenizers = "0.23.1"

[lints]
workspace = true
