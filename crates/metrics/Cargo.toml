[package]
name = "tau-metrics"
description = "Request metrics, traces and optional GPU diagnostics for tau.rs."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tau_metrics"
path = "src/lib.rs"

[dependencies]
candle = { package = "candle-core", version = "0.11.0", features = ["cuda"] }
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
